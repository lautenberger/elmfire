case_id: "CASE29_SUP"
case_title: "Case 29: Initial- and extended-attack suppression"
category: "Verification/coupling_tests"
guide_section: "3.2.10"

elmfire:
  bin: "${ELMFIRE_BIN:-elmfire}"
  config: "elmfire.data.in"

variants:
  - id: "extended_attack"
    guide_case: "Suppression-extended"
    config: "elmfire.data.in"
  - id: "initial_attack"
    guide_case: "Suppression-initial"
    config: "variants/initial_attack/elmfire.data.in"

postprocess:
  metrics: "outputs/metrics.json"
  figure: "figures/verification_summary.pdf"

namelist_contract:
  schema_version: 1
  report: "report/case_body.tex"
  files:
    - path: "elmfire.data.in"
      invariants:
        SUPPRESSION.ENABLE_EXTENDED_ATTACK: true
        SUPPRESSION.DT_EXTENDED_ATTACK: 3600
        TIME_CONTROL.SIMULATION_TSTOP: 250000.0
        SIMULATOR.NUM_IGNITIONS: 1
        OUTPUTS.DUMP_TIME_OF_ARRIVAL: true
    - path: "variants/initial_attack/elmfire.data.in"
      invariants:
        SUPPRESSION.ENABLE_INITIAL_ATTACK: true
        SUPPRESSION.INITIAL_ATTACK_TIME: 4800
        TIME_CONTROL.SIMULATION_TSTOP: 8000.0
        MONTE_CARLO.NUM_ENSEMBLE_MEMBERS: 2000
        SIMULATOR.NUM_IGNITIONS: 1
