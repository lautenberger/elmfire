case_id: "CASE07_IPC"
case_title: "Ignition Probability and SFT Convergence"
category: "Verification/coupling_tests"

elmfire:
  bin: "${ELMFIRE_BIN:-elmfire}"
  config: "elmfire.data.in"

postprocess:
  metrics: "outputs/metrics.json"
  figures:
    - "figures/input_configuration.pdf"
    - "figures/domain_result.pdf"

namelist_contract:
  schema_version: 1
  report: "report/case_body.tex"
  files:
    - path: "elmfire.data.in"
      invariants:
        OUTPUTS.DUMP_TIME_OF_ARRIVAL: true
        SIMULATOR.NUM_IGNITIONS: 0
        SPOTTING.ENABLE_SPOTTING: true
        SPOTTING.STOCHASTIC_SPOTTING: true
        SPOTTING.GENERATION_MODEL: "PER-AREA"
        SPOTTING.ACCUMULATION_MODEL: "EULERIAN"
        SPOTTING.IGNITION_MODEL: "SIMPLE"
        SPOTTING.USE_PHYSICAL_SPOTTING_DURATION: false
        SPOTTING.TAU_EMBERGEN: 10.0
        SPOTTING.NO_SURFACE_FIRE: true
        SPOTTING.LOCAL_IGNITION_TIME: 10.0
